{% extends 'store/base.html' %}
{% block content %}
<h2>Your Cart</h2>
{% if cart.items.count %}
  <ul>{% for i in cart.items.all %}
    <li>{{ i.name }} – {{ i.price }}
        <a href="{% url 'remove_from_cart' i.id %}">Remove</a>
    </li>
  {% endfor %}</ul>
  <a href="{% url 'place_order' %}">Place Order</a>
{% else %}
  <p>Cart is empty.</p>
{% endif %}
{% endblock %}
