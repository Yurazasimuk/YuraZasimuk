{% extends 'store/base.html' %}
{% block content %}
<h2>My Orders</h2>
{% for o in orders %}
  <div>
    <p>Order #{{ o.id }} – {{ o.status }} – {{ o.created_at }}</p>
    <ul>{% for i in o.items.all %}
      <li>{{ i.name }} – {{ i.price }}</li>
    {% endfor %}</ul>
  </div>
{% endfor %}
{% endblock %}
